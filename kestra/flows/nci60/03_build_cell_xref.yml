id: build_nci60_cell_xref
namespace: prod.nci60

description: |
  Build im_nci_cell_line_xref: Cellosaurus → NCI-60 cell-name bridge.
  Requires raw_cellosaurus_celllines to exist (loaded separately — Cellosaurus flat file
  must be downloaded once to Tier 2 and ingested via extract_cellosaurus_celllines.py).
  Run after prod.nci60.load_raw_nci60 and prod.nci60.build_nci60_tables succeed.

labels:
  pipeline: nci60
  stage: build

inputs:
  - id: git_branch
    type: STRING
    defaults: main

variables:
  repo_dir: nf_streamlit

tasks:
  - id: preflight_check
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Fail fast if raw_cellosaurus_celllines is absent or empty.
    url: "jdbc:postgresql://{{ secret('PG_HOST') }}:{{ secret('PG_PORT') }}/{{ secret('PG_DATABASE') }}"
    username: "{{ secret('PG_USER') }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      SELECT count(*) AS cellosaurus_rows FROM raw_cellosaurus_celllines;
    fetchType: FETCH_ONE

  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        url: https://github.com/mocomakers/nf_streamlit
        branch: "{{ inputs.git_branch }}"
        directory: "{{ vars.repo_dir }}"

      - id: run_xref_sql
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: postgres:16
        env:
          PGHOST: "{{ secret('PG_HOST') }}"
          PGPORT: "{{ secret('PG_PORT') }}"
          PGUSER: "{{ secret('PG_USER') }}"
          PGDATABASE: "{{ secret('PG_DATABASE') }}"
          PGPASSWORD: "{{ secret('PG_PASSWORD') }}"
        commands:
          - cd {{ vars.repo_dir }}
          - psql -v ON_ERROR_STOP=1 -f kestra/scripts/sql/build_nci_cell_line_xref.sql
        timeout: PT30M

  - id: verify_xref
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: |
      Baseline (local DB 2026-06-07): 163 cell lines, 76.7% matched.
    url: "jdbc:postgresql://{{ secret('PG_HOST') }}:{{ secret('PG_PORT') }}/{{ secret('PG_DATABASE') }}"
    username: "{{ secret('PG_USER') }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      SELECT
        count(*)                                          AS total_cell_lines,
        count(*) FILTER (WHERE cvcl_id IS NOT NULL)      AS matched,
        count(*) FILTER (WHERE match_source = 'unmatched') AS unmatched
      FROM im_nci_cell_line_xref;
    fetchType: FETCH_ONE

triggers: []
