id: load_raw_nci60
namespace: prod.nci60

description: |
  Download NCI-60 raw CSVs from the public Google Drive "Datasets" folder and
  bulk-load into PostgreSQL raw tables (raw_nci_nci60_* , raw_nci_nsc_*).
  Requires Kestra secrets for Postgres. Clones this repo on the worker first.

labels:
  pipeline: nci60
  stage: load

inputs:
  - id: git_branch
    type: STRING
    defaults: main
    description: Branch to clone (use feature/NCI60 until merged)

  - id: data_cache_path
    type: STRING
    defaults: /datasets/nf-streamlit
    description: |
      Persistent CSV cache (compose mount /var/lib/kestra/nf-datasets → this path).
      Script uses local files first; downloads only if CSVs for this run are missing.

  - id: skip_download
    type: BOOLEAN
    defaults: false
    description: Never download from Drive (fail if local CSVs missing). Default is local-first auto.

  - id: force_download
    type: BOOLEAN
    defaults: false
    description: Always re-download from Drive even when local cache has the CSVs

  - id: nci_only
    type: BOOLEAN
    defaults: true
    description: When downloading, use GDRIVE_NCI_FOLDER_ID (not full Datasets folder)

  - id: only_tables
    type: STRING
    required: false
    description: Comma-separated manifest ids (e.g. doseresp). Empty = all.

  - id: dry_run
    type: BOOLEAN
    defaults: false

variables:
  repo_dir: nf_streamlit

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Share worker filesystem so clone_repo and load_raw see the same repo tree.
    tasks:
      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        description: Fetch pipeline scripts from GitHub (flows alone do not include Python).
        url: https://github.com/mocomakers/nf_streamlit
        branch: "{{ inputs.git_branch }}"
        directory: "{{ vars.repo_dir }}"

      - id: load_raw
        type: io.kestra.plugin.scripts.python.Commands
        description: Install deps and run load_nci60_raw.py
        warningOnStdErr: false
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          volumes:
            - /var/lib/kestra/nf-datasets:/datasets/nf-streamlit:rw
        containerImage: python:3.11-slim
        beforeCommands:
          - apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc && rm -rf /var/lib/apt/lists/*
          - pip install --no-cache-dir psycopg[binary] pyyaml gdown tqdm
        env:
          PGHOST: "{{ secret('PG_HOST') }}"
          PGPORT: "{{ secret('PG_PORT') }}"
          PGUSER: "{{ secret('PG_USER') }}"
          PGDATABASE: "{{ secret('PG_DATABASE') }}"
          PGPASSWORD: "{{ secret('PG_PASSWORD') }}"
          PGSSLMODE: "{{ secret('PG_SSLMODE') }}"
          GDRIVE_DATASETS_FOLDER_ID: "{{ secret('GDRIVE_DATASETS_FOLDER_ID') }}"
          GDRIVE_NCI_FOLDER_ID: "{{ secret('GDRIVE_NCI_FOLDER_ID') }}"
          DATA_ROOT: "{{ inputs.data_cache_path }}"
          ONLY_TABLES: "{{ inputs.only_tables }}"
          SKIP_DOWNLOAD: "{{ inputs.skip_download }}"
          FORCE_DOWNLOAD: "{{ inputs.force_download }}"
          NCI_ONLY: "{{ inputs.nci_only }}"
          DRY_RUN: "{{ inputs.dry_run }}"
        commands:
          - cd {{ vars.repo_dir }}
          - |
            python kestra/scripts/load_nci60_raw.py \
              --data-root "$DATA_ROOT" \
              $( [ "$SKIP_DOWNLOAD" = "true" ] && echo --skip-download ) \
              $( [ "$FORCE_DOWNLOAD" = "true" ] && echo --force-download ) \
              $( [ "$NCI_ONLY" = "true" ] && echo --nci-only ) \
              $( [ "$DRY_RUN" = "true" ] && echo --dry-run )
        retry:
          type: constant
          interval: PT2M
          maxAttempt: 2
        timeout: PT6H

  - id: verify_raw_tables
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: |
      Row-count parity check against local-DB baseline (2026-06-07).
      NCI60 core (required): doseresp=24492523. NSC: cas/mw_mf/smiles=331845, sid_cid=331186, names=268496.
      HTS384 (optional, paths TBD): doseresp=444705, gi50/ic50/lc50/tgi=87921, oneconc=3494.
      Tables missing from warehouse show NULL (not yet loaded).
    url: "jdbc:postgresql://{{ secret('PG_HOST') }}:{{ secret('PG_PORT') }}/{{ secret('PG_DATABASE') }}"
    username: "{{ secret('PG_USER') }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      SELECT
        (SELECT count(*) FROM raw_nci_nci60_doseresp)                                    AS nci60_doseresp,
        (SELECT count(*) FROM raw_nci_nci60_gi50)                                        AS nci60_gi50,
        (SELECT count(*) FROM raw_nci_nci60_ic50)                                        AS nci60_ic50,
        (SELECT count(*) FROM raw_nci_nci60_lc50)                                        AS nci60_lc50,
        (SELECT count(*) FROM raw_nci_nci60_oneconc)                                     AS nci60_oneconc,
        (SELECT count(*) FROM raw_nci_nci60_tgi)                                         AS nci60_tgi,
        (SELECT count(*) FROM raw_nci_nsc_cas)                                           AS nsc_cas,
        (SELECT count(*) FROM raw_nci_nsc_chemical_names)                                AS nsc_chemical_names,
        (SELECT count(*) FROM raw_nci_nsc_mw_mf)                                        AS nsc_mw_mf,
        (SELECT count(*) FROM raw_nci_nsc_sid_cid)                                       AS nsc_sid_cid,
        (SELECT count(*) FROM raw_nci_nsc_smiles)                                        AS nsc_smiles,
        (SELECT CASE WHEN to_regclass('raw_nci_hts384_doseresp') IS NOT NULL THEN count(*) END FROM raw_nci_hts384_doseresp) AS hts384_doseresp,
        (SELECT CASE WHEN to_regclass('raw_nci_hts384_gi50')     IS NOT NULL THEN count(*) END FROM raw_nci_hts384_gi50)     AS hts384_gi50,
        (SELECT CASE WHEN to_regclass('raw_nci_hts384_ic50')     IS NOT NULL THEN count(*) END FROM raw_nci_hts384_ic50)     AS hts384_ic50,
        (SELECT CASE WHEN to_regclass('raw_nci_hts384_lc50')     IS NOT NULL THEN count(*) END FROM raw_nci_hts384_lc50)     AS hts384_lc50,
        (SELECT CASE WHEN to_regclass('raw_nci_hts384_tgi')      IS NOT NULL THEN count(*) END FROM raw_nci_hts384_tgi)      AS hts384_tgi,
        (SELECT CASE WHEN to_regclass('raw_nci_hts384_oneconc')  IS NOT NULL THEN count(*) END FROM raw_nci_hts384_oneconc)  AS hts384_oneconc,
        (SELECT CASE WHEN to_regclass('raw_nci_dtp_nci_zscore')  IS NOT NULL THEN count(*) END FROM raw_nci_dtp_nci_zscore)  AS nci_dtp_zscore;
    fetchType: FETCH_ONE

triggers: []
